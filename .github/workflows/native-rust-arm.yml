name: Native ARM64 Rust PXE
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact PXE Tools commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  first-boot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    env:
      PXE_SOURCE: ${{ inputs.source }}
    steps:
      - name: Validate the source revision
        run: '[[ "$PXE_SOURCE" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: williamboglietti/pxe-tools
          ref: ${{ env.PXE_SOURCE }}
          persist-credentials: false
      - name: Build an ARM64 Debian 13 appliance with native dnsmasq and Rust
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PXE_SOURCE"
          test "$(uname -m)" = aarch64
          inputs=$(mktemp -d "$RUNNER_TEMP/arm64-rust.XXXXXXXX")
          image="pxe-native-e2e-${PXE_SOURCE:0:10}:local"
          rustup toolchain install 1.96.0 --profile minimal
          cargo +1.96.0 build --locked --release --manifest-path rust/Cargo.toml
          install -m 0755 rust/target/release/pxe-tools-rust "$inputs/pxe-tools-rust-lab"
          python3 packaging/native/build-local-package.py "$inputs/native.deb" --architecture arm64 --version '0.0.1~local1'
          dpkg-deb --field "$inputs/native.deb" Package Version Architecture
          sha256sum "$inputs/native.deb" "$inputs/pxe-tools-rust-lab"
          docker build --platform linux/arm64 --tag "$image" -f - "$inputs" <<'DOCKERFILE'
          FROM debian:13-slim
          COPY native.deb /var/tmp/native.deb
          COPY --chmod=0755 pxe-tools-rust-lab /usr/local/libexec/pxe-tools-rust-lab
          RUN apt-get update && apt-get install -y --no-install-recommends /var/tmp/native.deb systemd-sysv qemu-system-x86 qemu-utils && rm -f /var/tmp/native.deb && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          echo "PXE_NATIVE_PXE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Discover, install and boot Debian with PHP-FPM masked
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends tesseract-ocr
          if [ ! -c /dev/net/tun ]; then
            sudo install -d /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo -- env PXE_NATIVE_PXE_TEST=1 PXE_NATIVE_PXE_ARCH=arm64 PXE_NATIVE_PXE_BACKEND=rust \
            PXE_NATIVE_PXE_IMAGE="$PXE_NATIVE_PXE_IMAGE" PYTHONUNBUFFERED=1 \
            python3 tests/integration/test_native_discovery_install_chain_isolated.py
