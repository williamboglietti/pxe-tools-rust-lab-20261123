name: Packaged guided Rust PXE
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact PXE Tools commit
        required: true
        type: string
      architecture:
        description: Architecture filter
        type: choice
        options: [both, amd64, arm64]
        default: both

permissions:
  contents: read
jobs:
  first-boot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64, variant: apt}
          - {runner: ubuntu-24.04, arch: amd64, variant: docker}
          - {runner: ubuntu-24.04-arm, arch: arm64, variant: apt}
          - {runner: ubuntu-24.04-arm, arch: arm64, variant: docker}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 85
    env:
      PXE_SOURCE: ${{ inputs.source }}
      PXE_ARCH: ${{ matrix.arch }}
      PXE_VARIANT: ${{ matrix.variant }}
      ARCH_FILTER: ${{ inputs.architecture }}
    steps:
      - name: Validate the exact revision
        if: inputs.architecture == 'both' || inputs.architecture == matrix.arch
        run: '[[ "$PXE_SOURCE" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: inputs.architecture == 'both' || inputs.architecture == matrix.arch
        with:
          repository: williamboglietti/pxe-tools
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Build the requested guided distribution and fixture tools
        if: inputs.architecture == 'both' || inputs.architecture == matrix.arch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PXE_SOURCE"
          case "$PXE_ARCH" in amd64) test "$(uname -m)" = x86_64 ;; arm64) test "$(uname -m)" = aarch64 ;; esac
          inputs=$(mktemp -d "$RUNNER_TEMP/guided-rust.XXXXXXXX")
          image="pxe-native-e2e-${PXE_SOURCE:0:10}:local"
          appliance="pxe-guided-${PXE_SOURCE:0:10}:local"
          if [ "$PXE_VARIANT" = apt ]; then
            rustup toolchain install 1.96.0 --profile minimal
            cargo +1.96.0 build --locked --release --manifest-path rust/Cargo.toml
            strip rust/target/release/pxe-tools-rust
            python3 packaging/native/build-local-package.py "$inputs/native.deb" --architecture "$PXE_ARCH" \
              --version '0.1.0~guided1' --rust-guided --rust-binary rust/target/release/pxe-tools-rust
            dpkg-deb --field "$inputs/native.deb" Package Version Architecture Depends
            test "$(stat -c %s "$inputs/native.deb")" -le 26214400
            stat -c 'Guided .deb: %s bytes' "$inputs/native.deb"
            docker build --platform "linux/$PXE_ARCH" --tag "$image" -f - "$inputs" <<'DOCKERFILE'
          FROM debian:13-slim
          COPY native.deb /var/tmp/native.deb
          RUN apt-get update && apt-get install -y --no-install-recommends /var/tmp/native.deb systemd-sysv qemu-system-x86 qemu-utils socat && rm -f /var/tmp/native.deb && rm -rf /var/lib/apt/lists/*
          RUN ! dpkg-query -W -f='${Status}' php8.4-fpm 2>/dev/null | grep -q 'install ok installed'
          DOCKERFILE
          else
            docker build --platform "linux/$PXE_ARCH" --target rust-guided -f docker/pxe-tools/Dockerfile --tag "$appliance" .
            docker image inspect -f 'Guided image: {{.Os}}/{{.Architecture}} {{.Size}} bytes' "$appliance"
            docker build --platform "linux/$PXE_ARCH" --tag "$image" - <<'DOCKERFILE'
          FROM debian:13-slim
          RUN apt-get update && apt-get install -y --no-install-recommends debian-archive-keyring ca-certificates cpio gpgv curl dnsmasq-base python3 qemu-system-x86 qemu-utils socat && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          fi
          echo "PXE_NATIVE_PXE_IMAGE=$image" >> "$GITHUB_ENV"
          echo "PXE_RUST_GUIDED_DOCKER_IMAGE=$appliance" >> "$GITHUB_ENV"
      - name: Install Debian from PXE and verify first boot with PHP-FPM stopped
        if: inputs.architecture == 'both' || inputs.architecture == matrix.arch
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends tesseract-ocr
          if [ ! -c /dev/net/tun ]; then
            sudo install -d /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo -- env PXE_NATIVE_PXE_TEST=1 PXE_NATIVE_PXE_ARCH="$PXE_ARCH" PXE_NATIVE_PXE_BACKEND="rust-$PXE_VARIANT" \
            PXE_NATIVE_PXE_IMAGE="$PXE_NATIVE_PXE_IMAGE" PXE_RUST_GUIDED_DOCKER_IMAGE="$PXE_RUST_GUIDED_DOCKER_IMAGE" \
            PYTHONUNBUFFERED=1 python3 tests/integration/test_native_discovery_install_chain_isolated.py
